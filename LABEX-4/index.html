<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scientific Calculator | Aditya Singh</title>


<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">


</head>


<body>


<div class="background">

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

</div>



<div class="app">



<!-- Calculator -->

<div class="calculator">



<header>


<div>

<h1>🧮 Scientific Calculator</h1>

<p>Professional Edition</p>

</div>


<button id="themeBtn">
🌙
</button>


</header>





<!-- Display -->

<div class="display">


<div id="expression">
</div>


<div id="result">
0
</div>


</div>







<!-- Memory -->

<div class="row memory">


<button data-value="MC">
MC
</button>


<button data-value="MR">
MR
</button>


<button data-value="MS">
MS
</button>


<button data-value="M+">
M+
</button>


<button data-value="M-">
M-
</button>


</div>







<!-- Scientific -->

<div class="scientific">



<button data-value="sin">
sin
</button>


<button data-value="cos">
cos
</button>


<button data-value="tan">
tan
</button>


<button data-value="log">
log
</button>


<button data-value="ln">
ln
</button>



<button data-value="sqrt">
√
</button>


<button data-value="square">
x²
</button>


<button data-value="power">
xʸ
</button>


<button data-value="pi">
π
</button>


<button data-value="e">
e
</button>



</div>









<!-- Main Calculator -->

<div class="buttons">


<button class="danger" data-value="clear">
AC
</button>


<button data-value="delete">
⌫
</button>


<button data-value="(">
(
</button>


<button data-value=")">
)
</button>





<button data-value="7">
7
</button>


<button data-value="8">
8
</button>


<button data-value="9">
9
</button>


<button class="operator" data-value="/">
÷
</button>





<button data-value="4">
4
</button>


<button data-value="5">
5
</button>


<button data-value="6">
6
</button>


<button class="operator" data-value="*">
×
</button>





<button data-value="1">
1
</button>


<button data-value="2">
2
</button>


<button data-value="3">
3
</button>


<button class="operator" data-value="-">
-
</button>





<button data-value="0">
0
</button>


<button data-value=".">
.
</button>


<button class="operator" data-value="+">
+
</button>


<button class="equal" data-value="=">
=
</button>



</div>





</div>







<!-- History -->

<div class="history">


<h2>
📜 History
</h2>


<button id="clearHistory">
Clear
</button>


<div id="historyList">


</div>


</div>






</div>





<script src="script.js"></script>


</body>


</html>
